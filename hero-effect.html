<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTROPY -> ORDER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Syncopate:wght@400;700&display=swap');

        :root {
            --bg: #030303;
            --accent: #6366f1;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
        }

        /* The "Wow" Flash Layer */
        #flash {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }

        /* Displacement Filter Container */
        .distort-container {
            filter: url(#digitalChaos);
        }

        .hero-title {
            font-family: 'Syncopate', sans-serif;
            text-transform: uppercase;
        }

        /* Scanned Grid Background */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .grain-layer {
            position: fixed;
            inset: 0;
            z-index: 60;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        #ui-meta, #hero-body {
            transform: translateY(20px);
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="flash"></div>

    <!-- SVG Displacement Engine -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
        <defs>
            <filter id="digitalChaos" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="2" seed="1" />
                <feDisplacementMap id="displacement" in="SourceGraphic" scale="150" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- Noise Overlay -->
    <canvas id="noiseCanvas" class="grain-layer"></canvas>

    <div class="grid-bg"></div>

    <!-- Content -->
    <main class="relative z-10 distort-container text-center px-6">
        
        <div id="ui-meta" class="mb-8 opacity-0">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-indigo-500/30 bg-indigo-500/5 text-indigo-400 text-[10px] tracking-[0.3em] font-bold uppercase">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                System Reconstruction: Active
            </span>
        </div>

        <h1 id="main-title" class="hero-title text-5xl md:text-8xl lg:text-9xl font-bold leading-none mb-6 tracking-tight">
            SIGNAL
        </h1>

        <div id="hero-body" class="max-w-xl mx-auto opacity-0">
            <p class="text-neutral-400 text-lg md:text-xl font-light mb-10 leading-relaxed">
                Hyper-ordered infrastructure for the next generation of digital assets.
            </p>
            
            <div class="flex flex-wrap justify-center gap-6">
                <button class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-sm skew-x-[-10deg] transition-all transform hover:scale-110 active:scale-95">
                    INITIATE PROTOCOL
                </button>
                <button class="px-8 py-4 border border-white/10 hover:bg-white/5 text-white font-bold rounded-sm skew-x-[-10deg] transition-all">
                    VIEW SOURCE
                </button>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <nav id="nav" class="fixed top-0 w-full p-8 flex justify-between items-center opacity-0 z-50">
        <div class="font-bold tracking-tighter text-2xl">VOID//CORE</div>
        <div class="hidden md:flex gap-12 text-[10px] uppercase tracking-[0.4em] font-bold text-neutral-500">
            <a href="#" class="hover:text-white transition-colors">Nodes</a>
            <a href="#" class="hover:text-white transition-colors">Relay</a>
            <a href="#" class="hover:text-white transition-colors">Auth</a>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const titleElement = document.getElementById('main-title');
            const originalText = "SIGNAL";
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@&%*";
            
            // 1. Noise Grain Logic
            const canvas = document.getElementById('noiseCanvas');
            const ctx = canvas.getContext('2d', { alpha: true });
            let w, h;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            function renderNoise() {
                const idata = ctx.createImageData(w, h);
                const data = idata.data;
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() < 0.05 ? 255 : 0;
                    data[i] = val;     // R
                    data[i+1] = val;   // G
                    data[i+2] = val;   // B
                    data[i+3] = val > 0 ? 255 : 0; // A
                }
                ctx.putImageData(idata, 0, 0);
                requestAnimationFrame(renderNoise);
            }
            renderNoise();

            // 2. Scramble Animation
            function scrambleText(element, finalString, duration = 1) {
                let iteration = 0;
                const totalSteps = duration * 30;
                const interval = setInterval(() => {
                    element.innerText = finalString
                        .split("")
                        .map((char, index) => {
                            if (index < iteration) return finalString[index];
                            return chars[Math.floor(Math.random() * chars.length)];
                        })
                        .join("");
                    
                    iteration += finalString.length / totalSteps;
                    if (iteration >= finalString.length) {
                        element.innerText = finalString;
                        clearInterval(interval);
                    }
                }, 30);
            }

            // 3. Main GSAP Timeline
            const turb = document.getElementById('turbulence');
            const disp = document.getElementById('displacement');
            
            if (!turb || !disp) return;

            const tl = gsap.timeline();

            // Set initial state
            tl.set("#main-title", { opacity: 1, scale: 0.8 });
            
            // THE CHAOS PHASE
            // Use a dummy object to animate the SVG attributes manually for best performance
            const chaosState = { freq: 0.01, scale: 150 };
            
            tl.to(chaosState, {
                duration: 2,
                freq: 0.11,
                scale: 0,
                ease: "none",
                onUpdate: () => {
                    const seed = Math.floor(Math.random() * 100);
                    turb.setAttribute('seed', seed);
                    turb.setAttribute('baseFrequency', `${chaosState.freq} ${chaosState.freq}`);
                    disp.setAttribute('scale', chaosState.scale);
                }
            });

            // Start scrambling halfway through the chaos
            tl.add(() => {
                scrambleText(titleElement, originalText, 1.2);
            }, 0.8);

            // THE RESOLUTION SNAP
            tl.to("#flash", { opacity: 1, duration: 0.05, ease: "none" }, 1.95);
            tl.to("#flash", { opacity: 0, duration: 0.8, ease: "power2.out" }, 2.05);

            // Reveal UI
            tl.to(".distort-container", { filter: "none", duration: 0.1 }, 2);
            tl.to("#main-title", { 
                scale: 1, 
                letterSpacing: "0.2em", 
                duration: 1.5, 
                ease: "expo.out" 
            }, 2);

            tl.to("#ui-meta", { opacity: 1, y: 0, duration: 1 }, 2.1);
            tl.to("#hero-body", { opacity: 1, y: 0, duration: 1, stagger: 0.2 }, 2.2);
            tl.to("#nav", { opacity: 1, duration: 2 }, 2.5);
            
            // Fade out the heavy grain canvas
            tl.to("#noiseCanvas", { opacity: 0.05, duration: 3 }, 2);
        });
    </script>
</body>
</html>
